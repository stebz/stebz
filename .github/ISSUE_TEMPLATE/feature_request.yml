name: Feature request
description: Suggest an idea or a new feature for Stebz
title: "[Feature] "
labels: [ "enhancement" ]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to achieve? What problem does the current Stebz API not solve for you?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: What would you like to see? A code example of the desired API is very welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried or considered.
    validations:
      required: false
