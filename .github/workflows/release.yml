name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      revision:
        description: 'Release version to publish (tag name without the v prefix, e.g. 2.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: release
    steps:
      # manual runs may be started by anyone with write access, so verify the actor is an admin
      - name: Verify actor is an admin
        if: github.event_name == 'workflow_dispatch'
        run: |
          perm=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" --jq .permission)
          if [ "$perm" != "admin" ]; then
            echo "::error::Only repository admins can run Release manually (actor: ${{ github.actor }}, permission: $perm)"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: GPG_PASSPHRASE
      - name: Determine revision
        id: revision
        run: |
          if [ -n "$INPUT_REVISION" ]; then
            echo "revision=$INPUT_REVISION" >> "$GITHUB_OUTPUT"
          else
            echo "revision=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
        env:
          INPUT_REVISION: ${{ inputs.revision }}
      - name: Deploy to Maven Central
        run: mvn -B -ntp clean deploy -Drevision=${{ steps.revision.outputs.revision }} -DautoPublish=true -DwaitMaxTime=3600
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      # works for both tag pushes and manual runs: an existing tag is reused,
      # a missing one is created at the current commit
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.revision.outputs.revision }}
        run: |
          TAG="v$REVISION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do"
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists, creating release for it"
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          else
            echo "Tag $TAG does not exist, creating it at $GITHUB_SHA"
            gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
