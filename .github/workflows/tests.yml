name: Tests

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE', '.gitignore', '.editorconfig' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE', '.gitignore', '.editorconfig' ]

# cancel the superseded run of the same ref on a new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: '8'
            mvn-args: '-pl !stebz-reportportal'
          - java-version: '11'
    name: Tests (JDK ${{ matrix.java-version }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven
      # stebz-reportportal requires Java 11 to compile, so it is excluded from the JDK 8 job
      - name: Maven test
        run: mvn -B -ntp clean test ${{ matrix.mvn-args }}
      - name: Print coverage summary
        run: |
          echo "JaCoCo line coverage:"
          printf "%-30s %10s %10s %8s\n" "Module" "Covered" "Missed" "Percent"
          total_missed=0
          total_covered=0
          for f in */target/site/jacoco/jacoco.csv; do
            [ -e "$f" ] || continue
            module=${f%%/*}
            counts=$(awk -F, 'NR>1 {missed+=$8; covered+=$9} END {print missed + 0, covered + 0}' "$f")
            missed=${counts% *}
            covered=${counts#* }
            total_missed=$((total_missed + missed))
            total_covered=$((total_covered + covered))
            total=$((missed + covered))
            if [ "$total" -gt 0 ]; then percent=$((covered * 100 / total)); else percent=0; fi
            printf "%-30s %10d %10d %7d%%\n" "$module" "$covered" "$missed" "$percent"
          done
          total=$((total_missed + total_covered))
          if [ "$total" -gt 0 ]; then percent=$((total_covered * 100 / total)); else percent=0; fi
          printf "%-30s %10d %10d %7d%%\n" "TOTAL" "$total_covered" "$total_missed" "$percent"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java-version }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports-jdk${{ matrix.java-version }}
          path: '**/target/site/jacoco/**'
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload coverage to Codecov
        if: matrix.java-version == '11'
        uses: codecov/codecov-action@v7
        with:
          files: '**/target/site/jacoco/jacoco.xml'
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
