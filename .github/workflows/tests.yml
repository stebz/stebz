name: Tests

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE', '.gitignore', '.editorconfig' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE', '.gitignore', '.editorconfig' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: '8'
            mvn-args: '-pl !stebz-reportportal,!stebz-allure'
            coverage-files: '**/target/site/jacoco/jacoco.xml'
          - java-version: '11'
            module: 'stebz-reportportal'
            coverage-files: 'stebz-reportportal/target/site/jacoco/jacoco.xml'
          - java-version: '17'
            module: 'stebz-allure'
            coverage-files: 'stebz-allure/target/site/jacoco/jacoco.xml'
    name: Tests (JDK ${{ matrix.java-version }} modules)
    steps:
      # manual runs may be started by anyone with write access, so verify the actor is an admin
      - name: Verify actor is an admin
        if: github.event_name == 'workflow_dispatch'
        run: |
          perm=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" --jq .permission)
          if [ "$perm" != "admin" ]; then
            echo "::error::Only repository admins can run Tests manually (actor: ${{ github.actor }}, permission: $perm)"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven
      # every module is tested on the minimal JDK it requires: everything except
      # stebz-reportportal (Java 11) and stebz-allure (Java 17) runs on JDK 8
      - name: Maven test
        if: matrix.module == null
        run: mvn -B -ntp clean test ${{ matrix.mvn-args }}
      # build the module dependencies without tests, then run only the module tests
      - name: Build module dependencies
        if: matrix.module != null
        run: mvn -B -ntp clean install -pl ${{ matrix.module }} -am -DskipTests -Dgpg.skip=true
      - name: Maven test (module only)
        if: matrix.module != null
        run: mvn -B -ntp test -pl ${{ matrix.module }}
      - name: Print coverage summary
        run: |
          echo "JaCoCo line coverage:"
          printf "%-30s %10s %10s %8s\n" "Module" "Covered" "Missed" "Percent"
          total_missed=0
          total_covered=0
          for f in */target/site/jacoco/jacoco.csv; do
            [ -e "$f" ] || continue
            module=${f%%/*}
            counts=$(awk -F, 'NR>1 {missed+=$8; covered+=$9} END {print missed + 0, covered + 0}' "$f")
            missed=${counts% *}
            covered=${counts#* }
            total_missed=$((total_missed + missed))
            total_covered=$((total_covered + covered))
            total=$((missed + covered))
            if [ "$total" -gt 0 ]; then percent=$((covered * 100 / total)); else percent=0; fi
            printf "%-30s %10d %10d %7d%%\n" "$module" "$covered" "$missed" "$percent"
          done
          total=$((total_missed + total_covered))
          if [ "$total" -gt 0 ]; then percent=$((total_covered * 100 / total)); else percent=0; fi
          printf "%-30s %10d %10d %7d%%\n" "TOTAL" "$total_covered" "$total_missed" "$percent"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk${{ matrix.java-version }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports-jdk${{ matrix.java-version }}
          path: '**/target/site/jacoco/**'
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ${{ matrix.coverage-files }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
