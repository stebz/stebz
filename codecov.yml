# Codecov configuration: https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    # The overall project number is informational for now: the module set is
    # still catching up, so it must not block pull requests.
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    # New and changed lines must be covered by tests.
    patch:
      default:
        target: 80%
        threshold: 0%

ignore:
  # AspectJ load-time weaving rewrites StepAspects when the class is loaded, so
  # JaCoCo cannot correlate the runtime class with the compiled one (see the
  # StepAspects class-id mismatch); its lines are reported as uncovered.
  - "stebz-annotations/src/main/java/org/stebz/annotation/aspect/StepAspects.java"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
